[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yapg"
version = "0.3.0"
description = "Yet another password generator: API keys, passwords, Diceware passphrases (en/es/de), PINs, recovery codes, TOTP, SSH/WireGuard/JWT/htpasswd material. CLI, REST API and an offline web page."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Antonio Elena" }]
keywords = ["password", "api-key", "passphrase", "diceware", "recovery-codes", "totp", "ssh", "wireguard", "secrets", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Utilities",
]

dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
api = ["sanic>=23.6"]
infra = ["cryptography>=42", "bcrypt>=4.0"]
qr = ["qrcode>=7.4"]
all = ["sanic>=23.6", "cryptography>=42", "bcrypt>=4.0", "qrcode>=7.4"]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "sanic>=23.6",
    "sanic-testing>=23.6",
    "cryptography>=42",
    "bcrypt>=4.0",
    "qrcode>=7.4",
]

[project.scripts]
keygen = "keygen.cli:app"
yapg = "keygen.cli:app"

[project.urls]
Homepage = "https://github.com/aelena/yapg"
Repository = "https://github.com/aelena/yapg"
Issues = "https://github.com/aelena/yapg/issues"
"Web page" = "https://aelena.com/yapg/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keygen = ["data/*.txt", "data/*.md", "data/licenses/*.txt"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/keygen/cli.py" = ["E501"]
"src/keygen/presets.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
