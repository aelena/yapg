name: Release to PyPI

# Trusted publishing (OIDC): no API token is stored anywhere. PyPI trusts this
# workflow file, in this repository, running in the "pypi" environment.
# Tag a commit on main as vX.Y.Z (matching pyproject's version) and push the tag.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches pyproject's version
        run: |
          python - <<'PY'
          import os, sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          sys.exit(0 if tag == f"v{version}" else f"tag {tag} != v{version}")
          PY
      - run: pip install build
      - run: python -m build
      - name: Smoke-test the wheel
        run: |
          pip install "$(ls dist/*.whl)[all]"
          yapg version
          yapg selftest
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/yapg-py/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
